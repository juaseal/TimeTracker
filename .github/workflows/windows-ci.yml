name: Windows CI
on:
  push:
  pull_request:
jobs:
  build-and-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TimeTracker.sln
      - run: dotnet build TimeTracker.sln -c Release --no-restore
      - run: dotnet run --project TimeTracker.Tests/TimeTracker.Tests.csproj -c Release --no-build --no-restore